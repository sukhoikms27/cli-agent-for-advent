# День 30 — systemd override для Ollama на VPS
#
# Применяется через: sudo systemctl edit ollama
# (создаёт /etc/systemd/system/ollama.service.d/override.conf)
# Затем: sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Назначение: ограничить параллелизм (OOM-предохранитель), bind localhost,
# удержать модель в RAM, ограничить ресурсы.

[Service]
# Параллельные слоты: 1 на дешёвом VPS (главный OOM-предохранитель).
# Каждый слот = отдельный KV-cache → RAM. 2 слота на 8GB = риск OOM.
Environment="OLLAMA_NUM_PARALLEL=1"

# Держать модель загруженной 30 минут (default 5m → cold-start 10-30с).
# Для always-on: -1 (всегда в RAM), но блокирует RAM полностью.
Environment="OLLAMA_KEEP_ALIVE=30m"

# Bind ТОЛЬКО localhost (поверх default). Наружу — через Caddy/Nginx reverse proxy.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# CORS: перечислить конкретные origin, ИЗБЕГАТЬ "*" (abuse через браузер).
# Для CLI-only доступа (без браузера) — оставить пустым или не задавать.
# Environment="OLLAMA_ORIGINS=https://app.ВАШ-ДОМЕН.ru"

# Ограничения ресурсов (hardening): Ollama + модель не должны съесть весь VPS.
MemoryMax=6G
CPUQuota=350%
